name: build-exe

# main 에 올라올 때마다 Windows 실행파일을 빌드해서
# Releases 의 "latest" 에 zip 으로 올린다.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "timer.html"
      - "version.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (net48 + WebView2)
        run: dotnet build app/GnmcTimer.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/GNMC-Timer | Out-Null
          Copy-Item out/* pkg/GNMC-Timer -Recurse -Force
          Get-ChildItem pkg/GNMC-Timer -Recurse -Include *.pdb,*.xml | Remove-Item -Force
          Copy-Item timer.html, version.txt, 설치안내.txt pkg/GNMC-Timer -Force
          Compress-Archive -Path pkg/GNMC-Timer -DestinationPath GNMC-Timer-win.zip -Force
          Get-ChildItem pkg/GNMC-Timer -Recurse | Select-Object FullName, Length

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe 를 찾을 수 없음: $iscc" }
          & $iscc app/installer.iss "/DSrcDir=$PWD\pkg\GNMC-Timer" "/DOutDir=$PWD" "/DAppVersion=$ver"
          Get-Item GNMC-Timer-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: GNMC-Timer-win
          path: |
            GNMC-Timer-Setup.exe
            GNMC-Timer-win.zip

      - name: Move "latest" tag to this commit
        if: github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish to Releases (latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 타이머 실행파일 (최신)
          body: |
            **설치:** `GNMC-Timer-Setup.exe` 를 받아 실행하세요. (관리자 권한 불필요)
            설치 중 "바탕 화면 바로 가기", "Windows 시작 시 자동 실행" 을 체크할 수 있습니다.

            압축 파일(`GNMC-Timer-win.zip`)은 설치 없이 폴더째 쓰고 싶을 때만 쓰면 됩니다.

            빌드 커밋: ${{ github.sha }}
          files: |
            GNMC-Timer-Setup.exe
            GNMC-Timer-win.zip
          prerelease: false
