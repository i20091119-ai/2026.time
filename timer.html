<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>타이머</title>
<style>
  :root{
    --bg:#0e1626;
    --panel:#16223a;
    --ink:#f4f7ff;
    --muted:#8fa3c4;
    --accent:#ffcc33;
    --accent-dim:#c79a1f;
    --run:#48d38a;
    --danger:#ff5a6a;
    --ring-track:#26344f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    overflow:hidden;user-select:none;
  }

  /* =====================================================
     세로 화면 3등분 레이아웃
       상단 1/3 : 현재 시각
       중간 1/3 : 타이머
       하단 1/3 : 공백 (책상에 가려 보이지 않는 영역)
     ===================================================== */
  #app{
    position:fixed;inset:0;
    display:grid;
    grid-template-rows:1fr 1fr 1fr;
    overflow:hidden;
  }
  .zone{min-height:0;overflow:hidden;}

  /* ===== 상단 1/3 : 현재 시각 ===== */
  .zone-clock{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.2vh;padding:2vh 4vw;
  }
  .logobox{
    background:#fff;border-radius:14px;
    padding:.8vh 2.4vw;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .logobox img{width:min(36vw,360px);height:auto;display:block;}
  .date{
    font-size:min(4.2vw,2.8vh);font-weight:600;
    color:var(--muted);letter-spacing:.04em;
  }
  .clock{
    font-variant-numeric:tabular-nums;
    font-weight:800;line-height:1;
    font-size:min(19vw,13vh);
    letter-spacing:-0.02em;
  }
  .clock .sec{font-size:.5em;color:var(--muted);font-weight:700;margin-left:.15em;}

  /* ===== 중간 1/3 : 타이머 ===== */
  .zone-timer{
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:3vw;padding:1.5vh 4vw;
    border-top:2px solid var(--panel);
  }
  .clockwrap{
    position:relative;
    width:min(46vw,28vh);
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  svg.ring{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:5;}
  .ring-prog{
    fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;
    transition:stroke .4s ease;
  }
  .time{
    position:absolute;
    font-variant-numeric:tabular-nums;
    font-weight:800;
    font-size:min(13vw,8vh);
    letter-spacing:-0.02em;
    line-height:1;
  }
  .time.warn{color:var(--danger);}
  .statelabel{
    position:absolute;
    top:19%;
    font-size:min(3.4vw,2.2vh);
    font-weight:600;
    color:var(--muted);
    letter-spacing:.05em;
  }

  .panelcol{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:1.2vh;
  }
  .presets{display:flex;gap:1.5vw;width:100%;}
  .preset{
    flex:1;padding:1.2vh 0;
    background:var(--panel);border:2px solid transparent;border-radius:14px;
    color:var(--ink);font-size:min(3.8vw,2.6vh);font-weight:700;
    cursor:pointer;transition:.15s;
  }
  .preset.active{border-color:var(--accent);color:var(--accent);}
  .preset:active{transform:scale(.96);}

  .controls{display:flex;flex-direction:column;gap:1.2vh;width:100%;}
  .btn{
    border:none;border-radius:14px;cursor:pointer;
    font-size:min(4.6vw,3.2vh);font-weight:800;
    padding:1.6vh 0;transition:.15s;color:#0e1626;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--accent);padding:2vh 0;}
  .btn.primary.running{background:var(--run);}
  .btn.reset{background:var(--panel);color:var(--muted);}

  /* 키보드 안내 (한 줄 요약) */
  .keyguide{
    display:flex;flex-wrap:wrap;align-items:center;gap:.6vh 1.6vw;
    font-size:min(2.6vw,1.7vh);color:var(--muted);font-weight:600;
  }
  .key{
    display:inline-block;min-width:1.8em;text-align:center;
    background:#0e1626;border:1.5px solid var(--muted);border-radius:6px;
    padding:.15em .4em;color:var(--ink);font-weight:800;margin-right:.3em;
  }
  .ver{margin-left:auto;opacity:.6;font-weight:500;}

  /* ===== 하단 1/3 : 공백 ===== */
  .zone-blank{background:var(--bg);}

  /* ===== 최소화 버튼 (우상단) / 전체화면 버튼 (좌상단) ===== */
  .mini-toggle,.fs-toggle{
    position:fixed;top:1.6vh;
    width:min(9vw,56px);height:min(9vw,56px);
    border:none;border-radius:14px;
    background:var(--panel);color:var(--muted);
    font-size:min(5vw,26px);cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;
    opacity:.55;
  }
  .mini-toggle{right:1.6vh;}
  .fs-toggle{left:1.6vh;}
  .mini-toggle:active,.fs-toggle:active{transform:scale(.92);}

  /* ===== 최소화 모드 : 중간 영역에 남은 시간 숫자만 크게 ===== */
  body.mini svg.ring,body.mini .statelabel,
  body.mini .panelcol,body.mini .fs-toggle{display:none;}
  body.mini .clockwrap{width:auto;aspect-ratio:auto;}
  body.mini .time{position:static;font-size:min(28vw,18vh);}

  /* 종료 깜빡임 */
  @keyframes flash{0%,100%{background:var(--bg);}50%{background:#3a1420;}}
  body.done{animation:flash .8s ease-in-out 6;}
  @media (prefers-reduced-motion:reduce){
    body.done{animation:none;}
    .ring-prog{transition:none;}
  }
</style>
</head>
<body>

  <button class="mini-toggle" id="miniBtn" title="최소화">▁</button>

  const presets=document.querySelectorAll('.preset');
  const miniBtn=document.getElementById('miniBtn');
  const fsBtn=document.getElementById('fsBtn');
  const clockText=document.getElementById('clockText');
  const dateText=document.getElementById('dateText');

  let totalMs=20*60*1000;
  let remainMs=totalMs;
  let running=false;
  let endTime=0;
  let raf=null;
  let lastBeepSec=-1;
  let audioCtx=null;

  // ===== 현재 시각 (상단 1/3) =====
  const DAYS=['일','월','화','수','목','금','토'];
  const p2=n=>String(n).padStart(2,'0');
  function updateClock(){
    const d=new Date();
    clockText.innerHTML=p2(d.getHours())+':'+p2(d.getMinutes())+'<span class="sec">'+p2(d.getSeconds())+'</span>';
    dateText.textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAYS[d.getDay()]+')';
  }
  updateClock();
  setInterval(updateClock,250);

  // 버전 표시 (launcher.ps1 이 ?v=버전 으로 열어 줌)
  try{
    const v=new URLSearchParams(location.search).get('v');
    if(v)document.getElementById('verText').textContent='v'+v;
  }catch(e){}

  function getCtx(){
    if(!audioCtx){
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
    }
    if(audioCtx && audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }

  function fmt(ms){
    if(ms<0)ms=0;
    const s=Math.ceil(ms/1000);
    const m=Math.floor(s/60);
    const sec=s%60;
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }

  function render(){
    timeText.textContent=fmt(remainMs);
    const frac=totalMs>0?remainMs/totalMs:0;
    ring.style.strokeDashoffset=CIRC*(1-frac);
    // 1분 이하 경고색
    if(remainMs<=60000 && running){
      timeText.classList.add('warn');
      ring.style.stroke='#ff5a6a';
    }else{
      timeText.classList.remove('warn');
      ring.style.stroke='#ffcc33';
    }
  }

  function tick(){
    remainMs=endTime-Date.now();
    if(remainMs<=0){
      remainMs=0;
      finish();
      return;
    }
    // 30초 전부터 매초 삐빅
    const secLeft=Math.ceil(remainMs/1000);
    if(secLeft<=30 && secLeft!==lastBeepSec){
      lastBeepSec=secLeft;
      shortBeep(secLeft<=5);
    }
    render();
    raf=requestAnimationFrame(tick);
  }

  function start(){
    if(remainMs<=0)remainMs=totalMs;
    running=true;
    lastBeepSec=-1;
    endTime=Date.now()+remainMs;
    getCtx();
    startBtn.textContent='일시정지';
    startBtn.classList.add('running');
    stateLabel.textContent='진행 중';
    document.body.classList.remove('done');
    raf=requestAnimationFrame(tick);
  }

  function pause(){
    running=false;
    if(raf)cancelAnimationFrame(raf);
    remainMs=endTime-Date.now();
    if(remainMs<0)remainMs=0;
    startBtn.textContent='계속';
    startBtn.classList.remove('running');
    stateLabel.textContent='일시정지';
    render();
  }

  function reset(){
    running=false;
    if(raf)cancelAnimationFrame(raf);
    remainMs=totalMs;
    startBtn.textContent='시작';
    startBtn.classList.remove('running');
    stateLabel.textContent='준비';
    document.body.classList.remove('done');
    render();
  }

  function finish(){
    running=false;
    if(raf)cancelAnimationFrame(raf);
    startBtn.textContent='시작';
    startBtn.classList.remove('running');
    stateLabel.textContent='종료';
    document.body.classList.add('done');
    render();
    beep();
  }

  // 카운트다운 삐빅 (매초, 마지막 5초는 높고 강하게)
  function shortBeep(urgent){
    const ctx=getCtx();
    if(!ctx)return;
    const t=ctx.currentTime;
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type='square';
    o.frequency.value=urgent?1200:880;
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(urgent?0.5:0.35,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.start(t);o.stop(t+0.16);
  }

  // 종료음 (길게 삐——)
  function beep(){
    const ctx=getCtx();
    if(!ctx)return;
    let t=ctx.currentTime;
    for(let i=0;i<2;i++){
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.frequency.value=1000;o.type='square';
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      o.start(t);o.stop(t+0.72);
      t+=0.85;
    }
  }

  startBtn.addEventListener('click',()=>{
    running?pause():start();
  });
  resetBtn.addEventListener('click',reset);

  presets.forEach(p=>{
    p.addEventListener('click',()=>{
      selectPreset(parseInt(p.dataset.min));
    });
  });

  // 최소화 토글
  miniBtn.addEventListener('click',()=>{
    document.body.classList.toggle('mini');
    miniBtn.textContent=document.body.classList.contains('mini')?'▢':'▁';
  });

  // 전체화면 토글
  fsBtn.addEventListener('click',()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    }else{
      document.exitFullscreen?.();
    }
  });

  // 전체화면 자동 진입
  function goFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    }
  }
  // 1) 로드 직후 시도 (Edge 키오스크 모드에선 이미 전체화면)
  window.addEventListener('load',()=>{ setTimeout(goFullscreen,100); });
  // 2) 자동 진입이 막히면, 첫 사용자 조작(터치/클릭/키) 시 전체화면 진입
  function firstGesture(){
    goFullscreen();
    document.removeEventListener('pointerdown',firstGesture);
    document.removeEventListener('keydown',firstGesture);
  }
  document.addEventListener('pointerdown',firstGesture);
  document.addEventListener('keydown',firstGesture);

  // 프리셋 선택 (키보드용)
  function selectPreset(min){
    presets.forEach(x=>{
      x.classList.toggle('active', parseInt(x.dataset.min)===min);
    });
    totalMs=min*60*1000;
    running=false;
    if(raf)cancelAnimationFrame(raf);
    remainMs=totalMs;
    startBtn.textContent='시작';
    startBtn.classList.remove('running');
    stateLabel.textContent='준비';
    document.body.classList.remove('done');
    render();
  }

  // 키보드 단축키: 1=5분, 2=20분, 3=25분, 4=초기화, Enter/Space=시작/일시정지
  document.addEventListener('keydown',(e)=>{
    if(e.key==='1'){selectPreset(5);}
    else if(e.key==='2'){selectPreset(20);}
    else if(e.key==='3'){selectPreset(25);}
    else if(e.key==='4'){reset();}
    else if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      running?pause():start();
    }
  });

  render();
})();
</script>
</body>
</html>
